name: Feature request
description: Suggest an improvement for ESP Partition Toolbox.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What ESP-IDF partition-table workflow or limitation should this improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Include sample partition CSV content, sdkconfig details, or references if useful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or alternative design you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, links, or examples if useful.
